# Cytoneighbor Experimental Framework Configuration

# Global settings
global:
  random_seed: 42
  output_dir: "results"
  log_level: "INFO"
  device: "cuda"  # cuda or cpu
  
# Model parameters
model_params:
  d_model: 1024
  depth: 6
  hidden: 2048
  dropout: 0.1
  diff_mode: "abs"
  learning_rate: 1e-3
  weight_decay: 1e-4
  epochs: 100
  batch_size: 512
  use_amp: true
  amp_dtype: "bf16"
  early_stopping_patience: 10

# Experiment configurations
experiments:
  benchmark_resolution:
    dataset_path: "Human immune.h5ad"  # Use unified dataset with full path
    # Real column names discovered through exploration
    cell_type_column: "final_annotation"
    batch_column: "batch"
    # Target subtypes ordered by difficulty: Easy (CD4) → Medium (CD8) → Hard (NK) → Extreme (NKT)
    # This creates a "difficulty gradient" for resolution stress testing
    target_subtypes:
      - "CD4+ T cells"    # Easy: Distinct markers (CD4, IL7R)
      - "CD8+ T cells"    # Medium: Distinct but similar to NKT (CD8A, CD8B)
      - "NK cells"        # Hard: Similar to NKT (NCAM1, KLRD1)
      - "NKT cells"       # Extreme: Shares markers with both NK and CD8+ T cells

    # === Key Fix 1: Mandatory core markers (prevent feature collapse from HVG filtering) ===
    mandatory_genes:
      # T Cell Lineage (resolving CD4 vs CD8 confusion)
      - "CD4"
      - "CD8A"
      - "CD8B"
      # Pan-T & NK Markers (resolving NK vs NKT confusion)
      - "CD3D"
      - "CD3E"
      - "CD3G"
      - "NCAM1"  # CD56
      - "KLRD1"  # CD94
      - "FCGR3A" # CD16
      # Subtype Function (enhance fine-grained discrimination)
      - "IL7R"
      - "CCR7"
      - "S100A4"
      - "FOXP3"
      - "GZMB"
      - "PRF1"

    # === Key Fix 2: Model parameter overrides for extreme resolution ===
    # Note: merge this config into model_params in trainer.py or benchmark_resolution.py
    model_params_override:
      rank_margin: 0.5         # [Key] Default 0.5 is too soft; CD4/CD8 needs stronger push (0.8) to separate them
      lambda_rank: 1.0         # [Key] Increase Rank Loss weight, prioritize inter-class distance over probability fitting

      synth_mult_per_dt: 0.5  
      # synth_alpha: 0.4 

      # neg_cache_pick_p: 0.95   # Increase probability of mining hard negative samples
      batch_size: 1024         # Larger batch to increase probability of sampling mutually exclusive pairs (CD4+CD8)
    
    # Evaluation parameters
    # metrics: ["iLISI", "cLISI", "F1", "ASW"]
    metrics: ["iLISI", "cLISI", "F1"]
    n_neighbors: 30
    umap_params:
      n_neighbors: 15
      min_dist: 0.1
      n_components: 2
    # Baseline methods for comparison
    baseline_methods:
      - "scvi"
      - "seurat"
      - "harmony"
  
  mechanism_analysis:
    dataset_path: "Pancreas.h5ad"
    cell_type_column: "cell_type"
    rare_cell_type: "delta"  # Use delta cells for extremely rare cell analysis
    downsample_fraction: 0.01  # Reduce to only ~50 cells (0.3% of total) - extremely rare
    recall_k_values: [5, 10, 20, 30, 50 , 100]  # Extended K range for comprehensive recall analysis
    synthesis_configs:
      case_a:
        synth_enable: false
      case_b:
        synth_enable: true
        synth_mult_per_dt: 3.0  # Aggressive oversampling for rare cells (20x multiplier)
        synth_cap_per_dt: 200  # Keep high cap to allow massive synthesis
  
  disease_discovery:
    dataset_path: "data/Diabetic Kidney Disease.h5ad"
    condition_column: "disease"
    cell_type_column: "cell_type"
    healthy_condition: "normal"
    disease_condition: "type 2 diabetes mellitus"
    
    # === Key Fix 1: Lock target cell type ===
    target_cell_type: "epithelial cell of proximal tubule"
    
    # === Key Fix 2: Clustering and trajectory parameters (optimized) ===
    # n_neighbors: 40          # Neighbors for adjacency graph (recommend 15-20, balance local and global structure)
    # leiden_resolution: 0.15    # Clustering resolution (recommend 0.3-0.4, avoid excessive fragmentation)
    # paga_threshold: 0.01      # Trajectory connectivity threshold (0.1-0.2, filter weak connections)

    # n_neighbors: 30          # [Modified] Reduced from 40 to 30 for tighter local connectivity, better slicing
    # leiden_resolution: 0.5   # [Modified] Increased from 0.15 to 0.5 (can try 0.4-0.8), to slice the dense deep feature map
    # paga_threshold: 0.01     # [Unchanged]

    n_neighbors: 15         # [Unchanged] 15 is correct; it successfully unfolded the compact cluster into a trajectory
    leiden_resolution: 0.5   # [Key modification] Reduced from 1.0 to 0.4. Use as starting point, gradually increase
    paga_threshold: 0.01     # [Unchanged]
    
    # === Memory optimization parameters ===
    n_top_genes: 3000         # Number of genes retained after HVG filtering (default 3000, adjust to 2000-5000)
    
    # === Key Fix 3: Biological validation markers (DKD-specific) ===
    # Adaptive (compensatory): SGLT2 (SLC5A2) responsible for glucose reabsorption during hyperfiltration
    adaptive_markers: ["SLC5A2", "LRP2"]  
    
    # Injured (damage): VCAM1 and KIM-1 (HAVCR1) are classic PT injury markers
    injury_markers: ["VCAM1", "HAVCR1"]   
    
    # Differential analysis parameters (unchanged)
    differential_expression:
      method: "wilcoxon"
      min_fold_change: 1.5
      max_pval: 0.05
  
  spatial_validation:
    sc_reference_path: "data/Visium/human_limb_scRNAseq.h5ad"
    st_query_path: "data/Visium/PCW8.1WSSS_THYst9383359.h5ad"
    tissue_filter: "hindlimb"
    in_tissue_key: "in_tissue"
    marker_genes:
      chondrocyte: ["SOX9", "COL2A1"]
      muscle: ["PAX3", "MYOD1"]

# Visualization settings
visualization:
  figure_size: [10, 8]
  dpi: 300
  color_palette: "Set1"
  save_formats: ["png", "pdf"]
  font_size: 12