# Cytoneighbor Experimental Framework Configuration

# Global settings
global:
  random_seed: 42
  output_dir: "results"
  log_level: "INFO"
  device: "cuda"  # cuda or cpu
  
# Model parameters
model_params:
  d_model: 1024
  depth: 6
  hidden: 2048
  dropout: 0.1
  diff_mode: "abs"
  learning_rate: 1e-3
  weight_decay: 1e-4
  epochs: 100
  batch_size: 512
  use_amp: true
  amp_dtype: "bf16"
  early_stopping_patience: 10

# Experiment configurations
experiments:
  benchmark_resolution:
    dataset_path: "Human immune.h5ad"  # Use unified dataset with full path
    # Real column names discovered through exploration
    cell_type_column: "final_annotation"
    batch_column: "batch"
    # Target subtypes ordered by difficulty: Easy (CD4) → Medium (CD8) → Hard (NK) → Extreme (NKT)
    # This creates a "difficulty gradient" for resolution stress testing
    target_subtypes:
      - "CD4+ T cells"    # Easy: Distinct markers (CD4, IL7R)
      - "CD8+ T cells"    # Medium: Distinct but similar to NKT (CD8A, CD8B)
      - "NK cells"        # Hard: Similar to NKT (NCAM1, KLRD1)
      - "NKT cells"       # Extreme: Shares markers with both NK and CD8+ T cells

    # === 关键修正 1: 强制保留的核心 Marker (防止被HVG过滤导致特征坍缩) ===
    mandatory_genes:
      # T Cell Lineage (解决 CD4 vs CD8 混淆的核心)
      - "CD4"
      - "CD8A"
      - "CD8B"
      # Pan-T & NK Markers (解决 NK vs NKT 混淆)
      - "CD3D"
      - "CD3E"
      - "CD3G"
      - "NCAM1"  # CD56
      - "KLRD1"  # CD94
      - "FCGR3A" # CD16
      # Subtype Function (增强细粒度区分)
      - "IL7R"
      - "CCR7"
      - "S100A4"
      - "FOXP3"
      - "GZMB"
      - "PRF1"

    # === 关键修正 2: 针对极限分辨率的模型参数重载 ===
    # 注意：需要在 trainer.py 或 benchmark_resolution.py 中合并此配置到 model_params
    model_params_override:
      rank_margin: 0.5         # [重点] 默认0.5太软，CD4/CD8需要更强的推力(0.8)将其分开
      lambda_rank: 1.0         # [重点] 提高Rank Loss权重，优先保证类间距离而非概率拟合

      synth_mult_per_dt: 0.5  
      # synth_alpha: 0.4 

      # neg_cache_pick_p: 0.95   # 增加挖掘难负样本(Hard Negative)的概率
      batch_size: 1024         # 增大Batch以增加采样到互斥对(CD4+CD8)的概率
    
    # Evaluation parameters
    # metrics: ["iLISI", "cLISI", "F1", "ASW"]
    metrics: ["iLISI", "cLISI", "F1"]
    n_neighbors: 30
    umap_params:
      n_neighbors: 15
      min_dist: 0.1
      n_components: 2
    # Baseline methods for comparison
    baseline_methods:
      - "scvi"
      - "seurat"
      - "harmony"
  
  mechanism_analysis:
    dataset_path: "Pancreas.h5ad"
    cell_type_column: "cell_type"
    rare_cell_type: "delta"  # Use delta cells for extremely rare cell analysis
    downsample_fraction: 0.01  # Reduce to only ~50 cells (0.3% of total) - extremely rare
    recall_k_values: [5, 10, 20, 30, 50 , 100]  # Extended K range for comprehensive recall analysis
    synthesis_configs:
      case_a:
        synth_enable: false
      case_b:
        synth_enable: true
        synth_mult_per_dt: 3.0  # Aggressive oversampling for rare cells (20x multiplier)
        synth_cap_per_dt: 200  # Keep high cap to allow massive synthesis
  
  disease_discovery:
    dataset_path: "data/Diabetic Kidney Disease.h5ad"
    condition_column: "disease"
    cell_type_column: "cell_type"
    healthy_condition: "normal"
    disease_condition: "type 2 diabetes mellitus"
    
    # === 关键修正 1: 锁定目标细胞 ===
    target_cell_type: "epithelial cell of proximal tubule"
    
    # === 关键修正 2: 聚类与轨迹参数 (已优化) ===
    # n_neighbors: 40          # 构建邻接图的邻居数 (推荐 15-20，平衡局部与全局结构)
    # leiden_resolution: 0.15    # 聚类分辨率 (推荐 0.3-0.4，避免过度碎片化)
    # paga_threshold: 0.01      # 轨迹连通性阈值 (0.1-0.2，过滤弱连接)

    # n_neighbors: 30          # [修改] 从 40 降回 30，让局部连接更紧密，有利于切分
    # leiden_resolution: 0.5   # [修改] 从 0.15 大幅提高到 0.5 (甚至可以尝试0.4-0.8)，去切开致密的深度特征图
    # paga_threshold: 0.01     # [保持不变]

    n_neighbors: 15         # [保持不变] 15 是对的，它成功把“铁疙瘩”展开成了“线”
    leiden_resolution: 0.5   # [重点修改] 从 1.0 降到 0.4。作为起点，让程序慢慢往上加
    paga_threshold: 0.01     #[保持不变]
    
    # === 内存优化参数 ===
    n_top_genes: 3000         # HVG筛选保留的基因数 (默认3000，可调整为2000-5000)
    
    # === 关键修正 3: 生物学验证 Marker (DKD特异) ===
    # Adaptive (代偿态): SGLT2 (SLC5A2) 负责高滤过时的葡萄糖重吸收
    adaptive_markers: ["SLC5A2", "LRP2"]  
    
    # Injured (损伤态): VCAM1 和 KIM-1 (HAVCR1) 是经典的 PT 损伤标志
    injury_markers: ["VCAM1", "HAVCR1"]   
    
    # 差异分析参数 (保持不变)
    differential_expression:
      method: "wilcoxon"
      min_fold_change: 1.5
      max_pval: 0.05
  
  spatial_validation:
    sc_reference_path: "data/Visium/human_limb_scRNAseq.h5ad"
    st_query_path: "data/Visium/PCW8.1WSSS_THYst9383359.h5ad"
    tissue_filter: "hindlimb"
    in_tissue_key: "in_tissue"
    marker_genes:
      chondrocyte: ["SOX9", "COL2A1"]
      muscle: ["PAX3", "MYOD1"]

# Visualization settings
visualization:
  figure_size: [10, 8]
  dpi: 300
  color_palette: "Set1"
  save_formats: ["png", "pdf"]
  font_size: 12