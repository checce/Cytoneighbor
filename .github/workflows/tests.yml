name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Cytoneighbor
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Quick sanity test
      run: |
        python tests/test_quick_run.py

    - name: Verify import
      run: |
        python -c "import cytoneighbor; print(f'Cytoneighbor {cytoneighbor.__version__} OK')"

    - name: Verify revision summary tables
      run: python repro/revision/check_summaries.py
