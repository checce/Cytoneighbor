[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cytoneighbor"
version = "0.1.0"
description = "Neighbour-evidence-guided single-cell state interpretation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Huan Hu"},
]
keywords = [
    "single-cell",
    "transcriptomics",
    "neighbour-evidence",
    "annotation",
    "integration",
    "rare-cell",
    "disease-mapping",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "anndata>=0.10",
    "scanpy>=1.9",
    "faiss-cpu>=1.7",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scvi-tools>=1.0",
    "umap-learn>=0.5",
    "tqdm>=4.65",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gpu = ["faiss-gpu>=1.7"]
integration = ["scvi-tools>=1.0"]
dev = ["jupyter", "ipykernel", "pytest", "leidenalg"]

[project.urls]
Homepage = "https://github.com/checce/Cytoneighbor"
Repository = "https://github.com/checce/Cytoneighbor"
Documentation = "https://github.com/checce/Cytoneighbor"

[tool.setuptools.packages.find]
include = ["cytoneighbor*"]
